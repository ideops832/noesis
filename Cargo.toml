[package]
name = "noesis"
version = "0.1.0"
edition = "2021"
description = "Compositional Semantics as Continuous Dynamics in Hyperdimensional Space"

[dependencies]
rand = "0.8"
rand_distr = "0.4"
rayon = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
criterion = "0.5"

[[bin]]
name = "noesis_server"
path = "src/bin/noesis_server.rs"

[[bench]]
name = "hdc_bench"
harness = false
