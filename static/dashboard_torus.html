<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOESIS Proto 3 — Torus</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#1a1a2e; color:#e0e0e0; font-family:system-ui,-apple-system,sans-serif; overflow:hidden; height:100vh; }
#app { display:flex; flex-direction:column; height:100vh; max-width:1400px; margin:0 auto; padding:8px; gap:4px; }

/* Header */
#header { display:flex; justify-content:space-between; align-items:center; padding:10px 16px; border:1px solid #333; border-radius:6px; background:#16162a; }
#header-left { display:flex; align-items:center; gap:20px; }
#header h1 { font-size:18px; font-weight:700; letter-spacing:1px; }
#coupling-wrap { display:flex; align-items:center; gap:8px; font-size:13px; }
#coupling-slider { width:160px; accent-color:#7c4dff; cursor:pointer; }
#coupling-val { font-variant-numeric:tabular-nums; width:36px; }
#conn { display:flex; align-items:center; gap:8px; font-size:13px; }
#conn-dot { width:10px; height:10px; border-radius:50%; background:#f44; transition:background .3s; }
#conn-dot.on { background:#4caf50; }

/* Main area */
#main { display:flex; gap:4px; flex:1; min-height:0; }

/* Left panel — torus canvas */
#left { width:500px; min-width:500px; border:1px solid #333; border-radius:6px; background:#16162a; padding:10px; display:flex; align-items:center; justify-content:center; }
#grid-canvas { cursor:grab; }
#grid-canvas:active { cursor:grabbing; }

/* Right panel — node details */
#right { flex:1; border:1px solid #333; border-radius:6px; background:#16162a; padding:16px; overflow-y:auto; display:flex; flex-direction:column; gap:14px; }
.section-title { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:#888; margin-bottom:8px; }
.bar-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:13px; }
.bar-label { width:90px; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bar-track { flex:1; height:18px; background:#222; border-radius:3px; overflow:hidden; position:relative; }
.bar-fill { height:100%; border-radius:3px; transition:width .3s ease, background .3s ease; min-width:0; }
.bar-val { width:40px; text-align:right; font-size:12px; font-variant-numeric:tabular-nums; }
#node-header { font-size:15px; font-weight:600; }
#node-dominant { font-size:13px; color:#ccc; margin-top:2px; }
.metric-line { font-size:13px; color:#ccc; margin-bottom:4px; }
.cat-row { display:flex; align-items:center; gap:8px; margin-bottom:4px; font-size:13px; }
.cat-swatch { width:14px; height:14px; border-radius:3px; flex-shrink:0; }
.cat-label { width:70px; }
.cat-bar { flex:1; height:14px; background:#222; border-radius:3px; overflow:hidden; }
.cat-fill { height:100%; border-radius:3px; }
.cat-count { width:60px; font-size:12px; color:#aaa; text-align:right; }

/* Timeline */
#timeline-wrap { border:1px solid #333; border-radius:6px; background:#16162a; padding:6px 6px 6px 36px; height:90px; min-height:70px; position:relative; }
#timeline-labels { position:absolute; left:6px; top:6px; bottom:6px; width:28px; display:flex; flex-direction:column; justify-content:space-around; }
.tl-label { font-size:10px; color:#888; font-weight:700; }
#timeline-canvas { width:100%; height:100%; display:block; }

/* Console */
#console { border:1px solid #333; border-radius:6px; background:#16162a; display:flex; flex-direction:column; height:140px; min-height:110px; }
#console-header { display:flex; justify-content:space-between; align-items:center; padding:6px 12px; border-bottom:1px solid #333; }
#console-header span { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:#888; }
#btn-demo { background:#2a2a4a; border:1px solid #555; color:#e0e0e0; padding:3px 12px; border-radius:4px; cursor:pointer; font-size:12px; }
#btn-demo:hover { background:#3a3a5a; }
#console-log { flex:1; overflow-y:auto; padding:6px 12px; font-family:'Courier New',monospace; font-size:12px; line-height:1.6; }
.log-cmd { color:#4fc3f7; }
.log-ok { color:#66bb6a; }
.log-err { color:#ef5350; }
.log-info { color:#aaa; }
#console-input-wrap { display:flex; align-items:center; padding:4px 12px; border-top:1px solid #333; }
#console-input-wrap::before { content:'> '; font-family:'Courier New',monospace; color:#4fc3f7; font-size:13px; }
#cmd-input { flex:1; background:transparent; border:none; outline:none; color:#e0e0e0; font-family:'Courier New',monospace; font-size:13px; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div id="header-left">
      <h1>NOESIS Proto 3 — Torus 4x4</h1>
      <div id="coupling-wrap">
        Coupling: <input type="range" id="coupling-slider" min="0" max="1" step="0.01" value="0.30">
        <span id="coupling-val">0.30</span>
      </div>
    </div>
    <div id="conn"><span id="conn-text">Disconnected</span><div id="conn-dot"></div></div>
  </div>
  <div id="main">
    <div id="left">
      <canvas id="grid-canvas" width="500" height="500"></canvas>
    </div>
    <div id="right">
      <div>
        <div id="node-header">Click a node to inspect</div>
        <div id="node-dominant">---</div>
      </div>
      <div>
        <div class="section-title">Top Concepts</div>
        <div id="concepts-bars"></div>
      </div>
      <div>
        <div class="section-title">Node Metrics</div>
        <div id="node-metrics"></div>
      </div>
      <div>
        <div class="section-title">Torus Metrics</div>
        <div id="torus-metrics"></div>
      </div>
      <div>
        <div class="section-title">Categories</div>
        <div id="categories"></div>
      </div>
    </div>
  </div>
  <div id="timeline-wrap">
    <div id="timeline-labels">
      <span class="tl-label">R0</span>
      <span class="tl-label">R1</span>
      <span class="tl-label">R2</span>
      <span class="tl-label">R3</span>
    </div>
    <canvas id="timeline-canvas"></canvas>
  </div>
  <div id="console">
    <div id="console-header"><span>Console</span><button id="btn-demo">Demo</button></div>
    <div id="console-log"></div>
    <div id="console-input-wrap"><input id="cmd-input" placeholder="feed 0 &quot;il gatto dorme&quot;" autocomplete="off"></div>
  </div>
</div>
<script>
// ── Constants ──
const COLORS = {
  animali:{h:15,s:80,l:55}, cibo:{h:140,s:70,l:45},
  lavoro:{h:220,s:75,l:55}, natura:{h:180,s:65,l:45},
  famiglia:{h:45,s:85,l:55}, altro:{h:260,s:40,l:50},
  nessuno:{h:0,s:0,l:40}
};
const API = 'http://localhost:8081/torus';
const WS_URL = 'ws://localhost:8080';
const TIMELINE_LEN = 300;
const GRID_SIZE = 4;

// ── Torus 3D Parameters ──
const TORUS_R = 150;  // major radius
const TORUS_r = 60;   // minor radius
const NODE_RADIUS = 18;
const PERSPECTIVE_D = 500;

// ── 3D Rotation State ──
let rotationY = 0.4;   // initial Y rotation (radians)
let rotationX = -0.3;  // initial X tilt (radians)
let autoRotate = true;
let isDragging = false;
let dragStartX = 0, dragStartY = 0;
let dragStartRotY = 0, dragStartRotX = 0;
let animFrameId = null;

// ── State ──
let frame = null;
let selectedNode = null;
let ws = null;
let reconnTimer = null;
let timelineData = []; // array of frames (row-averaged category per row)
let cmdHistory = [], cmdIdx = -1;

// ── DOM refs ──
const gridCanvas = document.getElementById('grid-canvas');
const gridCtx = gridCanvas.getContext('2d');
const tlCanvas = document.getElementById('timeline-canvas');
const tlCtx = tlCanvas.getContext('2d');
const logEl = document.getElementById('console-log');
const cmdInput = document.getElementById('cmd-input');
const connDot = document.getElementById('conn-dot');
const connText = document.getElementById('conn-text');
const couplingSlider = document.getElementById('coupling-slider');
const couplingVal = document.getElementById('coupling-val');

// ── Helpers ──
function catColor(cat, sim, act) {
  const c = COLORS[cat] || COLORS.nessuno;
  return `hsl(${c.h}, ${Math.round(c.s * Math.max(0.15, sim || 0))}%, ${Math.round(c.l * Math.max(0.2, act || 0))}%)`;
}
function catColorPure(cat) {
  const c = COLORS[cat] || COLORS.nessuno;
  return `hsl(${c.h}, ${c.s}%, ${c.l}%)`;
}
function catColorAlpha(cat, alpha) {
  const c = COLORS[cat] || COLORS.nessuno;
  return `hsla(${c.h}, ${c.s}%, ${c.l}%, ${alpha})`;
}
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function truncate(s, n) { return s && s.length > n ? s.slice(0, n) : (s || '---'); }

// ── Logging ──
function log(msg, cls='log-info') {
  const d = document.createElement('div');
  d.className = cls;
  d.textContent = msg;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}

// ── WebSocket ──
function wsConnect() {
  if (ws && ws.readyState <= 1) return;
  ws = new WebSocket(WS_URL);
  ws.onopen = () => { connDot.classList.add('on'); connText.textContent = 'Connected'; log('WebSocket connected', 'log-ok'); };
  ws.onclose = () => { connDot.classList.remove('on'); connText.textContent = 'Disconnected'; scheduleReconnect(); };
  ws.onerror = () => { ws.close(); };
  ws.onmessage = (ev) => {
    try {
      const msg = JSON.parse(ev.data);
      const torus = msg.torus || (msg.data && msg.data.torus);
      if (torus) onFrame(torus);
    } catch(e) { /* ignore */ }
  };
}
function scheduleReconnect() {
  if (reconnTimer) return;
  reconnTimer = setTimeout(() => { reconnTimer = null; wsConnect(); }, 2000);
}

function onFrame(data) {
  frame = data;
  if (data.coupling !== undefined) {
    couplingSlider.value = data.coupling;
    couplingVal.textContent = data.coupling.toFixed(2);
  }
  pushTimeline(data);
  // drawing happens in animation loop
  updateDetails();
  drawTimeline();
}

// ── 3D Torus Math ──

// Compute 3D position on torus for grid position (col, row)
function torusPosition(col, row) {
  const u = col * (2 * Math.PI / GRID_SIZE);
  const v = row * (2 * Math.PI / GRID_SIZE);
  const x = (TORUS_R + TORUS_r * Math.cos(v)) * Math.cos(u);
  const y = (TORUS_R + TORUS_r * Math.cos(v)) * Math.sin(u);
  const z = TORUS_r * Math.sin(v);
  return { x, y, z };
}

// Rotate point around X axis, then Y axis
function rotatePoint(x, y, z, ry, rx) {
  // Rotate around X axis
  const cosX = Math.cos(rx), sinX = Math.sin(rx);
  const y1 = y * cosX - z * sinX;
  const z1 = y * sinX + z * cosX;
  // Rotate around Y axis
  const cosY = Math.cos(ry), sinY = Math.sin(ry);
  const x2 = x * cosY - z1 * sinY;
  const z2 = x * sinY + z1 * cosY;
  return { x: x2, y: y1, z: z2 };
}

// Project 3D to 2D with perspective
function project(x, y, z) {
  const scale = PERSPECTIVE_D / (PERSPECTIVE_D + z);
  return {
    sx: x * scale + gridCanvas.width / 2,
    sy: y * scale + gridCanvas.height / 2,
    depth: z,
    scale: scale
  };
}

// Get projected node data for all 16 nodes
function getProjectedNodes() {
  if (!frame || !frame.nodes) return [];
  const projected = [];
  for (const node of frame.nodes) {
    const row = node.y !== undefined ? node.y : Math.floor(node.id / GRID_SIZE);
    const col = node.x !== undefined ? node.x : node.id % GRID_SIZE;
    const pos3d = torusPosition(col, row);
    const rotated = rotatePoint(pos3d.x, pos3d.y, pos3d.z, rotationY, rotationX);
    const proj = project(rotated.x, rotated.y, rotated.z);
    projected.push({
      node,
      col, row,
      rx: rotated.x, ry: rotated.y, rz: rotated.z,
      sx: proj.sx, sy: proj.sy,
      depth: proj.depth,
      scale: proj.scale
    });
  }
  return projected;
}

// ── Torus Surface Mesh ──
// Generate intermediate points on the torus surface for mesh rendering
function torusSurfacePoint(uFrac, vFrac) {
  const u = uFrac * 2 * Math.PI;
  const v = vFrac * 2 * Math.PI;
  const x = (TORUS_R + TORUS_r * Math.cos(v)) * Math.cos(u);
  const y = (TORUS_R + TORUS_r * Math.cos(v)) * Math.sin(u);
  const z = TORUS_r * Math.sin(v);
  return { x, y, z };
}

// ── 3D Torus Drawing ──
function drawTorus() {
  const ctx = gridCtx;
  const W = gridCanvas.width, H = gridCanvas.height;
  ctx.clearRect(0, 0, W, H);

  // Draw wireframe mesh of torus surface
  const meshU = 32, meshV = 16;
  const meshPoints = [];
  for (let i = 0; i <= meshU; i++) {
    meshPoints[i] = [];
    for (let j = 0; j <= meshV; j++) {
      const pt = torusSurfacePoint(i / meshU, j / meshV);
      const rot = rotatePoint(pt.x, pt.y, pt.z, rotationY, rotationX);
      const proj = project(rot.x, rot.y, rot.z);
      meshPoints[i][j] = { sx: proj.sx, sy: proj.sy, depth: proj.depth, scale: proj.scale };
    }
  }

  // Draw filled quad patches sorted by depth (back to front)
  const quads = [];
  for (let i = 0; i < meshU; i++) {
    for (let j = 0; j < meshV; j++) {
      const p00 = meshPoints[i][j];
      const p10 = meshPoints[i + 1][j];
      const p11 = meshPoints[i + 1][j + 1];
      const p01 = meshPoints[i][j + 1];
      const avgDepth = (p00.depth + p10.depth + p11.depth + p01.depth) / 4;

      // Find which grid cell this quad belongs to for coloring
      const uMid = (i + 0.5) / meshU;
      const vMid = (j + 0.5) / meshV;
      const gridCol = Math.floor(uMid * GRID_SIZE) % GRID_SIZE;
      const gridRow = Math.floor(vMid * GRID_SIZE) % GRID_SIZE;

      quads.push({ p00, p10, p11, p01, avgDepth, gridCol, gridRow });
    }
  }
  quads.sort((a, b) => b.avgDepth - a.avgDepth); // back to front

  for (const q of quads) {
    let fillColor = 'rgba(30, 30, 60, 0.4)';
    let strokeColor = 'rgba(80, 80, 140, 0.15)';

    if (frame && frame.nodes) {
      const nodeIdx = q.gridRow * GRID_SIZE + q.gridCol;
      const node = frame.nodes.find(n => {
        const r = n.y !== undefined ? n.y : Math.floor(n.id / GRID_SIZE);
        const c = n.x !== undefined ? n.x : n.id % GRID_SIZE;
        return r === q.gridRow && c === q.gridCol;
      });
      if (node) {
        const cat = node.category || 'nessuno';
        const sim = node.dominant_similarity || 0;
        const act = node.activation || 0;
        // Depth-based shading: patches further away are darker
        const depthFactor = clamp(0.3 + 0.7 * (1 - (q.avgDepth + 250) / 500), 0.1, 1.0);
        const alpha = 0.25 * depthFactor * Math.max(0.3, sim);
        fillColor = catColorAlpha(cat, alpha);
        strokeColor = `rgba(100, 100, 160, ${0.12 * depthFactor})`;
      }
    }

    ctx.beginPath();
    ctx.moveTo(q.p00.sx, q.p00.sy);
    ctx.lineTo(q.p10.sx, q.p10.sy);
    ctx.lineTo(q.p11.sx, q.p11.sy);
    ctx.lineTo(q.p01.sx, q.p01.sy);
    ctx.closePath();
    ctx.fillStyle = fillColor;
    ctx.fill();
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }

  // Get projected nodes
  const projected = getProjectedNodes();
  if (projected.length === 0) {
    // Draw empty torus label
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.font = '14px system-ui';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Waiting for torus data...', W / 2, H / 2);
    return;
  }

  // Draw connections between neighboring nodes (lines)
  // Each node connects to its 4 neighbors on the torus grid (with wrapping)
  ctx.lineWidth = 1.5;
  for (const pn of projected) {
    const col = pn.col, row = pn.row;
    // Right neighbor
    const rightCol = (col + 1) % GRID_SIZE;
    const rightNeighbor = projected.find(p => p.col === rightCol && p.row === row);
    // Down neighbor
    const downRow = (row + 1) % GRID_SIZE;
    const downNeighbor = projected.find(p => p.col === col && p.row === downRow);

    const neighbors = [rightNeighbor, downNeighbor];
    for (const nb of neighbors) {
      if (!nb) continue;
      const agr = Math.max(pn.node.neighbor_agreement || 0, nb.node.neighbor_agreement || 0);
      const avgDepth = (pn.depth + nb.depth) / 2;
      const depthAlpha = clamp(0.3 + 0.7 * (1 - (avgDepth + 250) / 500), 0.1, 1.0);
      const alpha = (0.15 + agr * 0.5) * depthAlpha;
      ctx.strokeStyle = `rgba(180, 180, 255, ${alpha})`;
      ctx.beginPath();
      ctx.moveTo(pn.sx, pn.sy);
      ctx.lineTo(nb.sx, nb.sy);
      ctx.stroke();
    }
  }

  // Sort nodes by depth (back to front) for correct overlap
  projected.sort((a, b) => b.depth - a.depth);

  // Draw nodes
  for (const pn of projected) {
    const node = pn.node;
    const r = NODE_RADIUS * pn.scale;
    const sim = node.dominant_similarity || 0;
    const act = node.activation || 0;

    // Depth-based brightness
    const depthFactor = clamp(0.4 + 0.6 * (1 - (pn.depth + 250) / 500), 0.2, 1.0);

    // Node circle shadow
    ctx.beginPath();
    ctx.arc(pn.sx + 2, pn.sy + 2, r + 1, 0, 2 * Math.PI);
    ctx.fillStyle = `rgba(0, 0, 0, ${0.3 * depthFactor})`;
    ctx.fill();

    // Node circle
    ctx.beginPath();
    ctx.arc(pn.sx, pn.sy, r, 0, 2 * Math.PI);
    ctx.fillStyle = catColor(node.category, sim, Math.max(0.3, act) * depthFactor);
    ctx.fill();

    // Border based on neighbor_agreement
    const agr = node.neighbor_agreement || 0;
    if (agr > 0.5) {
      ctx.strokeStyle = `rgba(255,255,255,${0.6 * depthFactor})`;
      ctx.lineWidth = 1.5 * pn.scale;
    } else if (agr < 0.3) {
      ctx.strokeStyle = `rgba(0,0,0,${0.7 * depthFactor})`;
      ctx.lineWidth = 2.5 * pn.scale;
    } else {
      ctx.strokeStyle = `rgba(100,100,100,${0.5 * depthFactor})`;
      ctx.lineWidth = 1 * pn.scale;
    }
    ctx.stroke();

    // Selected highlight
    if (selectedNode === node.id) {
      ctx.beginPath();
      ctx.arc(pn.sx, pn.sy, r + 4 * pn.scale, 0, 2 * Math.PI);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2.5;
      ctx.stroke();
      // Glow
      ctx.beginPath();
      ctx.arc(pn.sx, pn.sy, r + 6 * pn.scale, 0, 2 * Math.PI);
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    // Text: only draw if node is facing somewhat forward and large enough
    if (depthFactor > 0.35 && r > 10) {
      ctx.fillStyle = `rgba(255,255,255,${depthFactor})`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      // Node ID
      ctx.font = `${Math.round(9 * pn.scale)}px system-ui`;
      ctx.fillText('N' + node.id, pn.sx, pn.sy - r * 0.35);
      // Dominant concept
      ctx.font = `bold ${Math.round(11 * pn.scale)}px system-ui`;
      ctx.fillText(truncate(node.dominant_concept, 6), pn.sx, pn.sy + r * 0.15);
      // Similarity value
      if (r > 14) {
        ctx.font = `${Math.round(8 * pn.scale)}px system-ui`;
        ctx.fillStyle = `rgba(255,255,255,${0.7 * depthFactor})`;
        ctx.fillText((sim).toFixed(2), pn.sx, pn.sy + r * 0.6);
      }
    }
  }
}

// ── Animation Loop ──
function animate() {
  if (autoRotate && !isDragging) {
    rotationY += 0.005;
  }
  drawTorus();
  animFrameId = requestAnimationFrame(animate);
}

// ── Mouse Interaction ──
gridCanvas.addEventListener('mousedown', (e) => {
  isDragging = true;
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  dragStartRotY = rotationY;
  dragStartRotX = rotationX;
  autoRotate = false;
});

window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - dragStartX;
  const dy = e.clientY - dragStartY;
  rotationY = dragStartRotY + dx * 0.01;
  rotationX = dragStartRotX + dy * 0.01;
  // Clamp X rotation to prevent flipping
  rotationX = clamp(rotationX, -Math.PI / 2, Math.PI / 2);
});

window.addEventListener('mouseup', () => {
  if (isDragging) {
    isDragging = false;
    // Resume auto-rotation after 3 seconds of no interaction
    setTimeout(() => { if (!isDragging) autoRotate = true; }, 3000);
  }
});

// Click to select node
gridCanvas.addEventListener('click', (e) => {
  if (!frame) return;
  const rect = gridCanvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (gridCanvas.width / rect.width);
  const my = (e.clientY - rect.top) * (gridCanvas.height / rect.height);

  const projected = getProjectedNodes();
  let closest = null;
  let closestDist = Infinity;
  for (const pn of projected) {
    const r = NODE_RADIUS * pn.scale;
    const dx = mx - pn.sx, dy = my - pn.sy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < r + 5 && dist < closestDist) {
      closest = pn;
      closestDist = dist;
    }
  }
  if (closest) {
    selectedNode = closest.node.id;
    updateDetails();
  }
});

// Prevent drag from triggering click unintentionally handled by checking distance
let clickStartX = 0, clickStartY = 0;
gridCanvas.addEventListener('mousedown', (e) => {
  clickStartX = e.clientX;
  clickStartY = e.clientY;
});
gridCanvas.addEventListener('click', (e) => {
  const dx = e.clientX - clickStartX;
  const dy = e.clientY - clickStartY;
  if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
    e.stopImmediatePropagation();
  }
}, true);

// ── Detail Panel ──
function updateDetails() {
  if (!frame) return;
  const node = selectedNode !== null ? frame.nodes.find(n => n.id === selectedNode) : null;

  // Node info
  const hdr = document.getElementById('node-header');
  const dom = document.getElementById('node-dominant');
  if (node) {
    hdr.textContent = `Node ${node.id} Details`;
    dom.textContent = `Dominant: ${node.dominant_concept || '---'} (${(node.dominant_similarity || 0).toFixed(2)}) ${node.category || ''}`;
  } else {
    hdr.textContent = 'Click a node to inspect';
    dom.textContent = '---';
  }

  // Top concepts bars
  const cBars = document.getElementById('concepts-bars');
  cBars.innerHTML = '';
  if (node && node.top_concepts) {
    node.top_concepts.slice(0, 6).forEach(tc => {
      const name = tc.concept || tc.word || tc[0] || '?';
      const val = tc.similarity || tc.score || tc[1] || 0;
      cBars.innerHTML += barHTML(name, val, catColorPure(node.category));
    });
  }

  // Node metrics
  const nm = document.getElementById('node-metrics');
  nm.innerHTML = '';
  if (node) {
    nm.innerHTML += barHTML('Agreement', node.neighbor_agreement || 0, '#4fc3f7');
    nm.innerHTML += barHTML('Activation', node.activation || 0, '#ff9800');
    nm.innerHTML += barHTML('Velocity', node.velocity || 0, '#ab47bc');
  }

  // Torus metrics
  const tm = document.getElementById('torus-metrics');
  tm.innerHTML = '';
  if (frame.metrics) {
    const m = frame.metrics;
    tm.innerHTML += barHTML('Consensus', m.consensus || 0, '#66bb6a');
    tm.innerHTML += barHTML('Spatial', m.spatial_coherence || 0, '#29b6f6');
    tm.innerHTML += `<div class="metric-line">Zones: ${m.num_zones || 0}</div>`;
    tm.innerHTML += barHTML('Topographic', m.topographic_quality || 0, '#ffa726');
  }

  // Categories
  const cats = document.getElementById('categories');
  cats.innerHTML = '';
  if (frame.metrics && frame.metrics.category_distribution) {
    const maxCount = Math.max(1, ...frame.metrics.category_distribution.map(c => c.count));
    frame.metrics.category_distribution.forEach(cd => {
      const color = catColorPure(cd.category);
      const pct = (cd.count / 16 * 100).toFixed(0);
      cats.innerHTML += `<div class="cat-row">
        <div class="cat-swatch" style="background:${color}"></div>
        <span class="cat-label">${cd.category}</span>
        <div class="cat-bar"><div class="cat-fill" style="width:${pct}%;background:${color}"></div></div>
        <span class="cat-count">${cd.count} nodes</span>
      </div>`;
    });
  }
}

function barHTML(label, val, color) {
  const pct = clamp(val, 0, 1) * 100;
  return `<div class="bar-row">
    <span class="bar-label">${label}</span>
    <div class="bar-track"><div class="bar-fill" style="width:${pct.toFixed(1)}%;background:${color}"></div></div>
    <span class="bar-val">${val.toFixed(2)}</span>
  </div>`;
}

// ── Timeline ──
function pushTimeline(data) {
  if (!data.nodes) return;
  // Compute average category color per row
  const entry = [];
  for (let r = 0; r < GRID_SIZE; r++) {
    let hSum = 0, sSum = 0, lSum = 0, count = 0;
    for (let c = 0; c < GRID_SIZE; c++) {
      const node = data.nodes[r * GRID_SIZE + c];
      if (!node) continue;
      const col = COLORS[node.category] || COLORS.nessuno;
      const act = Math.max(0.2, node.activation || 0);
      const sim = Math.max(0.15, node.dominant_similarity || 0);
      hSum += col.h; sSum += col.s * sim; lSum += col.l * act; count++;
    }
    entry.push(count ? { h: hSum / count, s: sSum / count, l: lSum / count } : { h: 0, s: 0, l: 30 });
  }
  timelineData.push(entry);
  if (timelineData.length > TIMELINE_LEN) timelineData.shift();
}

function drawTimeline() {
  const c = tlCanvas;
  const parent = c.parentElement;
  c.width = parent.clientWidth - 36;
  c.height = parent.clientHeight - 12;
  const ctx = tlCtx;
  ctx.clearRect(0, 0, c.width, c.height);
  const len = timelineData.length;
  if (len === 0) return;
  const rowH = c.height / GRID_SIZE;
  const colW = Math.max(1, c.width / TIMELINE_LEN);
  for (let r = 0; r < GRID_SIZE; r++) {
    for (let i = 0; i < len; i++) {
      const e = timelineData[i][r];
      ctx.fillStyle = `hsl(${e.h}, ${e.s}%, ${e.l}%)`;
      const x = (TIMELINE_LEN - len + i) * colW;
      ctx.fillRect(x, r * rowH, colW + 0.5, rowH - 1);
    }
  }
}

// ── Coupling Slider ──
let couplingTimeout = null;
couplingSlider.addEventListener('input', () => {
  couplingVal.textContent = parseFloat(couplingSlider.value).toFixed(2);
  clearTimeout(couplingTimeout);
  couplingTimeout = setTimeout(() => {
    const val = parseFloat(couplingSlider.value);
    fetch(`${API}/coupling`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ coupling: val }) })
      .then(r => r.json()).then(d => log(`Coupling -> ${val.toFixed(2)}`, 'log-ok'))
      .catch(e => log('Coupling error: ' + e, 'log-err'));
  }, 200);
});

// ── Console Commands ──
async function execCmd(raw) {
  const text = raw.trim();
  if (!text) return;
  cmdHistory.push(text);
  cmdIdx = cmdHistory.length;
  log('> ' + text, 'log-cmd');

  // Parse command
  const feedMatch = text.match(/^feed\s+(all|\d+)\s+"([^"]*)"$/i) || text.match(/^feed\s+(all|\d+)\s+(.+)$/i);
  const queryMatch = text.match(/^query\s+(\d+)\s+"([^"]*)"$/i) || text.match(/^query\s+(\d+)\s+(.+)$/i);
  const coupMatch = text.match(/^coupling\s+([\d.]+)$/i);
  const sleepMatch = text.match(/^sleep\s+(\d+)$/i);

  try {
    if (text === 'reset') {
      const r = await fetch('http://localhost:8081/reset', { method: 'POST' });
      const d = await r.json();
      log('Reset: ' + JSON.stringify(d), 'log-ok');
    } else if (text === 'topo') {
      if (frame && frame.metrics) {
        const m = frame.metrics;
        log(`Consensus: ${(m.consensus||0).toFixed(3)}  Spatial: ${(m.spatial_coherence||0).toFixed(3)}  Zones: ${m.num_zones||0}  Topo: ${(m.topographic_quality||0).toFixed(3)}`, 'log-info');
      } else {
        log('No torus data yet', 'log-info');
      }
    } else if (text === 'zones') {
      if (frame && frame.metrics) {
        log(`Zones: ${frame.metrics.num_zones || 0}`, 'log-info');
        if (frame.metrics.category_distribution) {
          frame.metrics.category_distribution.forEach(c => log(`  ${c.category}: ${c.count} nodes`, 'log-info'));
        }
      } else {
        log('No torus data yet', 'log-info');
      }
    } else if (text === 'demo') {
      runDemo();
    } else if (feedMatch) {
      const target = feedMatch[1];
      const sentence = feedMatch[2];
      const url = target.toLowerCase() === 'all' ? `${API}/feed/all` : `${API}/feed/${target}`;
      const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: sentence }) });
      const d = await r.json();
      log(`Feed ${target}: ${JSON.stringify(d)}`, 'log-ok');
    } else if (queryMatch) {
      const nodeId = queryMatch[1];
      const sentence = queryMatch[2];
      const r = await fetch(`${API}/query/${nodeId}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: sentence }) });
      const d = await r.json();
      log(`Query ${nodeId}: ${JSON.stringify(d)}`, 'log-ok');
    } else if (coupMatch) {
      const val = parseFloat(coupMatch[1]);
      couplingSlider.value = val;
      couplingVal.textContent = val.toFixed(2);
      const r = await fetch(`${API}/coupling`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ coupling: val }) });
      const d = await r.json();
      log(`Coupling -> ${val.toFixed(2)}: ${JSON.stringify(d)}`, 'log-ok');
    } else if (sleepMatch) {
      const n = parseInt(sleepMatch[1]);
      const r = await fetch(`${API}/idle`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ticks: n }) });
      const d = await r.json();
      log(`Sleep ${n}: ${JSON.stringify(d)}`, 'log-ok');
    } else {
      // Default: feed to node 0
      const r = await fetch(`${API}/feed/0`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
      const d = await r.json();
      log(`Feed 0: ${JSON.stringify(d)}`, 'log-ok');
    }
  } catch (e) {
    log('Error: ' + e.message, 'log-err');
  }
}

// Command input
cmdInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    execCmd(cmdInput.value);
    cmdInput.value = '';
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (cmdIdx > 0) { cmdIdx--; cmdInput.value = cmdHistory[cmdIdx]; }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (cmdIdx < cmdHistory.length - 1) { cmdIdx++; cmdInput.value = cmdHistory[cmdIdx]; }
    else { cmdIdx = cmdHistory.length; cmdInput.value = ''; }
  }
});

// ── Demo ──
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function cmd(text) {
  await execCmd(text);
}
